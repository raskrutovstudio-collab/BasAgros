      <ellipse cx="77" cy="102" rx="6" ry="4" transform="rotate(-11 77 102)"/>
      <ellipse cx="105" cy="113" rx="6" ry="4" transform="rotate(14 105 113)"/>
      <ellipse cx="60" cy="132" rx="6" ry="4" transform="rotate(-16 60 132)"/>
      <ellipse cx="91" cy="135" rx="6" ry="4" transform="rotate(8 91 135)"/>
