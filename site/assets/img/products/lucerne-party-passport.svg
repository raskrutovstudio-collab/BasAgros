  <g transform="translate(58 530)">
    <path d="M60 194c17-86 40-136 75-182M120 205c5-73 19-124 44-170M171 209c11-62 27-105 55-145" fill="none" stroke="#416d42" stroke-width="7" stroke-linecap="round"/>
    <g fill="#7451a2">
      <ellipse cx="132" cy="22" rx="19" ry="10" transform="rotate(-20 132 22)"/>
      <ellipse cx="146" cy="35" rx="19" ry="10" transform="rotate(9 146 35)"/>
      <ellipse cx="119" cy="39" rx="19" ry="10" transform="rotate(28 119 39)"/>
      <ellipse cx="160" cy="52" rx="18" ry="9" transform="rotate(-12 160 52)"/>
      <ellipse cx="153" cy="72" rx="18" ry="9" transform="rotate(14 153 72)"/>
      <ellipse cx="164" cy="48" rx="17" ry="9"/>
      <ellipse cx="216" cy="76" rx="18" ry="9" transform="rotate(-17 216 76)"/>
      <ellipse cx="229" cy="88" rx="18" ry="9" transform="rotate(12 229 88)"/>
      <ellipse cx="206" cy="94" rx="18" ry="9" transform="rotate(25 206 94)"/>
    </g>
    <g fill="#9b79c8" opacity=".86">
      <circle cx="139" cy="31" r="7"/><circle cx="151" cy="49" r="6"/><circle cx="128" cy="53" r="6"/>
      <circle cx="218" cy="84" r="6"/><circle cx="232" cy="99" r="6"/>
