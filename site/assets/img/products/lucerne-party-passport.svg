    <rect x="26" y="18" width="106" height="182" rx="28" fill="url(#glass)" stroke="#d8dccd" stroke-opacity=".38" stroke-width="3"/>
    <path d="M32 90c24-9 72-9 94 0v86c-24 8-70 8-94 0Z" fill="#9d7a30" opacity=".72"/>
    <g fill="#c39b48" opacity=".95">
