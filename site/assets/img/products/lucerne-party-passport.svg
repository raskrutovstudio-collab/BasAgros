<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Паспорт партии семян люцерны</title>
  <desc id="desc">Фирменная иллюстрация контроля качества: образец семян люцерны, документ партии, лабораторная ёмкость и цветущая люцерна.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172017"/>
      <stop offset=".52" stop-color="#0b100c"/>
      <stop offset="1" stop-color="#060806"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="16%" r="65%">
      <stop offset="0" stop-color="#d9aa3d" stop-opacity=".26"/>
      <stop offset=".42" stop-color="#9c7523" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eee2"/>
      <stop offset="1" stop-color="#d8d1bd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf6f"/>
      <stop offset=".5" stop-color="#d1a238"/>
      <stop offset="1" stop-color="#9e7620"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dce8da" stop-opacity=".25"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#90aa91" stop-opacity=".2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r=".8" fill="#fff" opacity=".045"/>
      <circle cx="25" cy="6" r=".65" fill="#fff" opacity=".025"/>
      <circle cx="16" cy="27" r=".8" fill="#fff" opacity=".03"/>
      <circle cx="31" cy="23" r=".55" fill="#fff" opacity=".035"/>
    </pattern>
  </defs>

  <rect width="720" height="900" rx="42" fill="url(#bg)"/>
  <rect width="720" height="900" rx="42" fill="url(#glow)"/>
  <ellipse cx="560" cy="180" rx="150" ry="120" fill="#dfb548" opacity=".08" filter="url(#soft)"/>
  <rect width="720" height="900" rx="42" fill="url(#grain)"/>

  <!-- distant lucerne field -->
  <g opacity=".72">
    <path d="M0 250C110 212 194 236 285 224c101-14 184-73 435-28v176H0Z" fill="#1d2b1c"/>
    <path d="M0 295c120-27 239-8 340-26 122-22 220-34 380 2v133H0Z" fill="#253a21"/>
    <g fill="#72549b" opacity=".62">
      <circle cx="82" cy="265" r="8"/><circle cx="128" cy="291" r="7"/><circle cx="177" cy="257" r="8"/>
      <circle cx="241" cy="306" r="7"/><circle cx="307" cy="272" r="8"/><circle cx="382" cy="296" r="7"/>
      <circle cx="463" cy="252" r="8"/><circle cx="540" cy="286" r="7"/><circle cx="612" cy="246" r="8"/>
    </g>
  </g>

