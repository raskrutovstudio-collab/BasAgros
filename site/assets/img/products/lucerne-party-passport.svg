    <path d="M0 84c0-38 30-70 70-70h112c14 0 26 12 26 26v64c0 20-16 36-36 36H70C30 140 0 121 0 84Z" fill="#c49a50"/>
    <path d="M180 54h170c30 0 50 16 50 33s-20 33-50 33H180Z" fill="#a87634"/>
    <path d="M35 76c24-26 109-35 143 0v42H35Z" fill="#a5792e"/>
    <g fill="#dbb45c">
      <ellipse cx="62" cy="81" rx="9" ry="5"/><ellipse cx="94" cy="72" rx="9" ry="5" transform="rotate(18 94 72)"/>
      <ellipse cx="128" cy="84" rx="9" ry="5" transform="rotate(-12 128 84)"/>
      <ellipse cx="160" cy="74" rx="9" ry="5" transform="rotate(10 160 74)"/>
      <ellipse cx="76" cy="104" rx="9" ry="5" transform="rotate(-9 76 104)"/>
      <ellipse cx="118" cy="103" rx="9" ry="5" transform="rotate(13 118 103)"/>
      <ellipse cx="151" cy="111" rx="9" ry="5" transform="rotate(-16 151 111)"/>
    </g>
  </g>

  <!-- gold quality seal -->
  <g transform="translate(72 90)" filter="url(#shadow)">
    <circle cx="62" cy="62" r="58" fill="#0b100c" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="62" cy="62" r="46" fill="none" stroke="#d9ad46" stroke-opacity=".38" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M62 88V57m0 7c-20 0-31-11-31-29 20 0 31 11 31 29Zm0-9c0-19 11-29 31-29 0 19-11 29-31 29Z" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
