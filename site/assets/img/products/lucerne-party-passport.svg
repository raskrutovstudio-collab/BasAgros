    <rect x="0" y="0" width="270" height="356" rx="18" fill="url(#paper)"/>
    <rect x="18" y="18" width="234" height="320" rx="12" fill="none" stroke="#b28c34" stroke-opacity=".5"/>
    <circle cx="135" cy="70" r="31" fill="#193d27"/>
    <path d="M135 91V66m0 6c-18 0-27-10-27-25 18 0 27 10 27 25Zm0-7c0-16 9-25 27-25 0 16-9 25-27 25Z" fill="none" stroke="#e2bd58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="62" y="118" width="146" height="9" rx="4.5" fill="#25372a" opacity=".82"/>
    <rect x="46" y="145" width="178" height="4" rx="2" fill="#7c776c" opacity=".48"/>
    <rect x="46" y="166" width="178" height="4" rx="2" fill="#7c776c" opacity=".38"/>
    <rect x="46" y="204" width="76" height="4" rx="2" fill="#7c776c" opacity=".42"/>
    <rect x="143" y="204" width="81" height="4" rx="2" fill="#7c776c" opacity=".42"/>
    <rect x="46" y="232" width="178" height="4" rx="2" fill="#7c776c" opacity=".36"/>
    <rect x="46" y="259" width="129" height="4" rx="2" fill="#7c776c" opacity=".36"/>
    <g transform="translate(180 278)">
