      <ellipse cx="128" cy="139" rx="9" ry="5" transform="rotate(-8 128 139)"/>
      <ellipse cx="164" cy="185" rx="9" ry="5" transform="rotate(23 164 185)"/>
      <ellipse cx="196" cy="128" rx="9" ry="5" transform="rotate(-16 196 128)"/>
      <ellipse cx="231" cy="171" rx="9" ry="5" transform="rotate(10 231 171)"/>
      <ellipse cx="268" cy="108" rx="9" ry="5" transform="rotate(-5 268 108)"/>
      <ellipse cx="309" cy="159" rx="9" ry="5" transform="rotate(19 309 159)"/>
      <ellipse cx="349" cy="126" rx="9" ry="5" transform="rotate(-21 349 126)"/>
      <ellipse cx="389" cy="175" rx="9" ry="5" transform="rotate(11 389 175)"/>
      <ellipse cx="424" cy="142" rx="9" ry="5" transform="rotate(-10 424 142)"/>
      <ellipse cx="458" cy="189" rx="9" ry="5" transform="rotate(22 458 189)"/>
      <ellipse cx="112" cy="207" rx="9" ry="5" transform="rotate(-13 112 207)"/>
      <ellipse cx="217" cy="211" rx="9" ry="5" transform="rotate(8 217 211)"/>
      <ellipse cx="333" cy="211" rx="9" ry="5" transform="rotate(-18 333 211)"/>
      <ellipse cx="439" cy="214" rx="9" ry="5" transform="rotate(14 439 214)"/>
