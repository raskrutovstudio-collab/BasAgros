      <circle cx="25" cy="25" r="18" fill="none" stroke="#355e3f" stroke-width="1.4" stroke-dasharray="2 3"/>
      <path d="M16 26l6 6 13-16" fill="none" stroke="#355e3f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

