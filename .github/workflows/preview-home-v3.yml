name: Publish Home V3 Preview
# redeploy-marker: 2026-09-07T12:30+06:00

on:
  push:
    branches:
      - design/home-v3
    paths:
      - src/templates/homepage.mjs
      - src/templates/layout.mjs
      - src/data/homepage.json
      - src/data/home-images.mjs
      - tools/build-site.mjs
      - site/assets/img/home/**
      - site/assets/css/**
      - site/assets/js/**
      - .github/workflows/preview-home-v3.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current approved site
        uses: actions/checkout@v4
        with:
          ref: work/cursor
          path: prod

      - name: Checkout isolated V3 branch
        uses: actions/checkout@v4
        with:
          ref: design/home-v3
          path: v3

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate optimized V3 HTML and bundles
        working-directory: v3
        run: node tools/build-site.mjs

      - name: Inject V3 homepage into preview subpath
        run: |
          rm -rf prod/site/preview/home-v3
          mkdir -p prod/site/preview/home-v3
          cp v3/site/index.html prod/site/preview/home-v3/index.html
          cp -R v3/site/assets prod/site/preview/home-v3/assets
          python - <<'PY'
          from pathlib import Path

          root = Path('prod/site/preview/home-v3')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          html = html.replace('"/assets/', '"assets/')
          html = html.replace("'/assets/", "'assets/")
          html = html.replace(', /assets/', ', assets/')
          index.write_text(html, encoding='utf-8')

          css_root = root / 'assets' / 'css'
          for css in css_root.glob('*.css'):
              text = css.read_text(encoding='utf-8')
              text = text.replace('/assets/', '../')
              css.write_text(text, encoding='utf-8')
          PY

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: prod/site

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy current site plus isolated V3 preview
        id: deployment
        uses: actions/deploy-pages@v4
