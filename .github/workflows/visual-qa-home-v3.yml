name: Visual QA Home V3

on:
  push:
    branches:
      - design/home-v3
    paths:
      - .github/workflows/visual-qa-home-v3.yml
      - src/templates/homepage.mjs
      - src/templates/layout.mjs
      - src/data/homepage.json
      - src/data/home-images.mjs
      - site/assets/css/home-square.css
      - site/assets/css/home-v3-qa.css
      - site/assets/css/home-v3-polish.css
      - site/assets/css/home-v3-feedback.css
      - site/assets/css/home-v3-audience.css
      - site/assets/css/home-v3-audience-icons.css
      - site/assets/css/home-v3-catalog-sculpted.css
      - site/assets/css/home-v3-catalog-terrain.css
      - site/assets/css/home-v3-crops-lux.css
      - site/assets/css/home-v3-crops-final.css
      - site/assets/css/home-v3-mobile.css
      - site/assets/css/home-v3-mobile-pass2.css
      - site/assets/css/home-v3-mobile-pass3.css
      - site/assets/css/home-v3-mobile-pass4.css
      - site/assets/css/home-v3-review-fixes.css
      - site/assets/css/home-v3-header-hotfix.css
      - site/assets/css/home-v3-purpose-icons.css
      - site/assets/css/home-v3-final-tuning.css
      - site/assets/css/home-v3-final-ui.css
      - site/assets/js/home.js
      - site/assets/js/home-v3-catalog-terrain.js
      - site/assets/js/home-v3-review-fixes.js
      - site/assets/js/home-v3-final-ui.js
      - site/assets/js/home-v3-mobile-pass3.js

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V3
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build V3
        run: |
          npm ci
          node tools/build-site.mjs

      - name: Inject current preview layers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          html = p.read_text(encoding='utf-8')
          styles = [
            'home-v3-header-hotfix.css',
            'home-v3-purpose-icons.css',
            'home-v3-audience-icons.css',
            'home-v3-final-tuning.css',
            'home-v3-final-ui.css',
            'home-v3-mobile-pass2.css',
            'home-v3-mobile-pass3.css',
            'home-v3-mobile-pass4.css',
          ]
          for name in styles:
              if name not in html:
                  html = html.replace('</head>', f'<link rel="stylesheet" href="/assets/css/{name}?qa=20260907c"></head>')
          for name in ['home-v3-final-ui.js','home-v3-mobile-pass3.js']:
              if name not in html:
                  html = html.replace('</body>', f'<script src="/assets/js/{name}?qa=20260907c" defer></script></body>')
          p.write_text(html, encoding='utf-8')
          PY

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile layout QA and screenshots
        run: |
          mkdir -p qa/screenshots
          python3 -m http.server 8765 --directory site >/tmp/basagros-v3-http.log 2>&1 &
          sleep 1
          cat > capture-home-v3.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const sizes = [['360',360,800],['390',390,844],['430',430,932]];
          const browser = await chromium.launch({ headless:true });
          const reports = [];

          for (const [name,width,height] of sizes) {
            const page = await browser.newPage({ viewport:{width,height}, deviceScaleFactor:1 });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type()==='error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push(String(err)));
            await page.goto('http://127.0.0.1:8765/', { waitUntil:'networkidle' });
            await page.waitForTimeout(800);

            const menu = page.locator('[data-menu-toggle]');
            if (await menu.count()) { await menu.click(); await page.waitForTimeout(100); await menu.click(); }
            for (const tab of await page.locator('[data-purpose-tab]').all()) { await tab.click(); await page.waitForTimeout(60); }
            for (const trigger of await page.locator('#audience .audience-scene-trigger').all()) { await trigger.click(); await page.waitForTimeout(60); }

            const catalogRail = page.locator('.home-catalog.home-catalog-lux-ready .home-category-grid');
            const catalogCards = page.locator('.home-catalog.home-catalog-lux-ready .home-category');
            const cardCount = await catalogCards.count();
            const catalogTitles = await catalogCards.locator('h3').allTextContents();
            const initialCatalog = await catalogRail.evaluate((rail) => {
              const cards = [...rail.querySelectorAll(':scope > .home-category')];
              const first = cards[0]?.getBoundingClientRect();
              const rb = rail.getBoundingClientRect();
              return {
                scrollLeft:+rail.scrollLeft.toFixed(1),
                scrollWidth:rail.scrollWidth,
                clientWidth:rail.clientWidth,
                firstLeft:first ? +first.left.toFixed(1) : null,
                railLeft:+rb.left.toFixed(1),
                firstVisible:!!first && first.right > 0 && first.left < innerWidth
              };
            });

            if (cardCount) {
              await catalogRail.dispatchEvent('pointerdown', { pointerType:'touch' });
              await catalogRail.evaluate((rail) => rail.scrollTo({ left:rail.scrollWidth, behavior:'auto' }));
              await page.waitForTimeout(350);
            }

            const endCatalog = await catalogRail.evaluate((rail) => {
              const cards = [...rail.querySelectorAll(':scope > .home-category')];
              const last = cards.at(-1)?.getBoundingClientRect();
              return {
                scrollLeft:+rail.scrollLeft.toFixed(1),
                maxScroll:+(rail.scrollWidth-rail.clientWidth).toFixed(1),
                lastLeft:last ? +last.left.toFixed(1) : null,
                lastRight:last ? +last.right.toFixed(1) : null,
                lastFullyVisible:!!last && last.left >= -2 && last.right <= innerWidth+2
              };
            });

            const report = await page.evaluate(() => {
              const vw=document.documentElement.clientWidth;
              const rootOverflow=Math.max(0,document.documentElement.scrollWidth-vw);
              const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const scrollAncestor=el=>{let p=el.parentElement;while(p&&p!==document.body){const s=getComputedStyle(p);if((s.overflowX==='auto'||s.overflowX==='scroll')&&p.scrollWidth>p.clientWidth+2)return true;p=p.parentElement}return false};
              const expected=el=>el.classList?.contains('lead-form-honeypot')||el.classList?.contains('home-request-aura')||(el.tagName==='IMG'&&Math.abs(el.getBoundingClientRect().left)<4&&Math.abs(el.getBoundingClientRect().right-vw)<4);
              const overflow=[];
              for(const el of document.body.querySelectorAll('*')){
                if(!visible(el)||scrollAncestor(el)||expected(el))continue;
                const r=el.getBoundingClientRect();
                if(r.left<-2||r.right>vw+2){overflow.push({tag:el.tagName.toLowerCase(),cls:String(el.className||'').slice(0,100),left:+r.left.toFixed(1),right:+r.right.toFixed(1)});if(overflow.length>=30)break}
              }
              const sections=[...document.querySelectorAll('main > section, main > div > section')].filter(visible).map(el=>{const r=el.getBoundingClientRect();return{id:el.id||'',cls:String(el.className||'').slice(0,70),height:+r.height.toFixed(0)}});
              return {viewport:vw,rootOverflow,overflow,sections,pageHeight:document.documentElement.scrollHeight};
            });

            report.name=name;
            report.consoleErrors=consoleErrors.slice(0,20);
            report.catalog={cardCount,catalogTitles,initial:initialCatalog,end:endCatalog};
            reports.push(report);

            console.log(`QA ${name}: rootOverflow=${report.rootOverflow}px overflowNodes=${report.overflow.length} pageHeight=${report.pageHeight}px errors=${report.consoleErrors.length}`);
            console.log('CATALOG',JSON.stringify(report.catalog));
            if(report.overflow.length) console.log('OVERFLOW',JSON.stringify(report.overflow));
            console.log('SECTIONS',JSON.stringify(report.sections));

            await catalogRail.evaluate((rail)=>rail.scrollTo({left:0,behavior:'auto'}));
            await page.evaluate(async()=>{const step=Math.max(320,Math.floor(innerHeight*.65));for(let y=0;y<document.documentElement.scrollHeight;y+=step){scrollTo(0,y);await new Promise(r=>setTimeout(r,45));}scrollTo(0,0)});
            await page.waitForTimeout(200);
            await page.screenshot({path:`qa/screenshots/home-v3-${name}.png`,fullPage:true});
            await page.close();
          }

          await browser.close();
          fs.writeFileSync('qa/mobile-report.json',JSON.stringify(reports,null,2));
          const hard=reports.some(r=>
            r.rootOverflow>2 || r.overflow.length>0 || r.consoleErrors.length>0 ||
            r.catalog.cardCount!==4 || !r.catalog.initial.firstVisible || !r.catalog.end.lastFullyVisible ||
            r.catalog.catalogTitles.length!==4
          );
          if(hard) process.exitCode=2;
          EOF
          node capture-home-v3.mjs

      - name: Upload mobile QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-v3-mobile-qa
          path: |
            qa/screenshots/*.png
            qa/mobile-report.json
          if-no-files-found: error
          retention-days: 2
