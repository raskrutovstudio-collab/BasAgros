# Production deployment for the approved work branch.
name: Deploy BAS Agros to GitHub Pages

on:
  push:
    branches:
      - work/cursor
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work/cursor
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lucerne party image
        run: |
          file site/assets/img/products/lucerne-party-quality.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('site/assets/img/products/lucerne-party-quality.webp')
          b = p.read_bytes()
          assert len(b) > 10000, f'image too small: {len(b)} bytes'
          assert b[:4] == b'RIFF', b[:12]
          assert b[8:12] == b'WEBP', b[:12]
          print(f'lucerne party image verified: {len(b)} bytes')
          PY

      - name: Validate and build site
        run: npm run quality:all

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload production site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
