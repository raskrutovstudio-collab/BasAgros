name: Performance QA Home V3

on:
  push:
    branches:
      - design/home-v3
    paths:
      - .github/workflows/performance-qa-home-v3.yml
      - tools/build-site.mjs
      - src/templates/homepage.mjs
      - src/templates/layout.mjs
      - src/data/homepage.json
      - src/data/home-images.mjs
      - site/assets/css/**
      - site/assets/js/**
      - site/assets/img/home/**

permissions:
  contents: read

jobs:
  lighthouse-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V3
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build optimized V3
        run: |
          npm ci
          node tools/build-site.mjs

      - name: Verify bundling
        run: |
          test -f site/assets/css/home-v3.bundle.css
          test -f site/assets/js/home-v3.bundle.js
          test "$(grep -o 'home-v3.bundle.css' site/index.html | wc -l)" -eq 1
          test "$(grep -o 'home-v3.bundle.js' site/index.html | wc -l)" -eq 1
          echo "CSS requests in homepage: $(grep -o '<link[^>]*stylesheet' site/index.html | wc -l)"
          echo "JS requests in homepage: $(grep -o '<script[^>]*src=' site/index.html | wc -l)"
          wc -c site/assets/css/home-v3.bundle.css site/assets/js/home-v3.bundle.js

      - name: Install Lighthouse and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          npm install --no-save lighthouse@12.8.2

      - name: Run Lighthouse mobile performance audit
        run: |
          mkdir -p qa/performance
          python3 -m http.server 8765 --directory site >/tmp/basagros-perf-http.log 2>&1 &
          sleep 1
          CHROME_BIN=$(command -v chromium-browser || command -v chromium)
          npx lighthouse http://127.0.0.1:8765/ \
            --chrome-path="$CHROME_BIN" \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --screenEmulation.width=390 \
            --screenEmulation.height=844 \
            --screenEmulation.deviceScaleFactor=1 \
            --throttling-method=simulate \
            --output=json \
            --output=html \
            --output-path=qa/performance/lighthouse-mobile \
            --quiet

      - name: Print performance diagnostics
        run: |
          cat > qa/performance/summary.mjs <<'EOF'
          import fs from 'node:fs';
          const p = 'qa/performance/lighthouse-mobile.report.json';
          const lhr = JSON.parse(fs.readFileSync(p,'utf8'));
          const a = lhr.audits;
          const score = Math.round((lhr.categories.performance.score || 0) * 100);
          const metric = id => ({id,title:a[id]?.title,display:a[id]?.displayValue,numeric:a[id]?.numericValue,score:a[id]?.score});
          const metrics = ['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index','interactive'].map(metric);
          const ids = ['render-blocking-resources','unused-css-rules','unused-javascript','modern-image-formats','uses-responsive-images','uses-optimized-images','offscreen-images','uses-text-compression','server-response-time','network-requests','mainthread-work-breakdown','bootup-time','dom-size'];
          const opportunities = ids.map(id=>a[id]).filter(Boolean).map(x=>({id:x.id,title:x.title,display:x.displayValue,score:x.score,savingsMs:x.details?.overallSavingsMs||0,savingsBytes:x.details?.overallSavingsBytes||0,items:(x.details?.items||[]).slice(0,10)})).sort((x,y)=>(y.savingsMs-x.savingsMs)||(y.savingsBytes-x.savingsBytes));
          const summary={score,metrics,opportunities};
          fs.writeFileSync('qa/performance/summary.json',JSON.stringify(summary,null,2));
          console.log('PERFORMANCE_SCORE',score);
          for(const m of metrics) console.log('METRIC',m.id,m.display,'score=',m.score);
          for(const o of opportunities) console.log('AUDIT',o.id,'score=',o.score,'display=',o.display,'saveMs=',Math.round(o.savingsMs),'saveKB=',Math.round(o.savingsBytes/1024));
          EOF
          node qa/performance/summary.mjs

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-v3-performance-qa
          path: |
            qa/performance/lighthouse-mobile.report.json
            qa/performance/lighthouse-mobile.report.html
            qa/performance/summary.json
          if-no-files-found: error
          retention-days: 3
